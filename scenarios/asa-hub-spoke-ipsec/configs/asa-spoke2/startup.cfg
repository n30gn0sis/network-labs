! asa-spoke2: VTI over IKEv2 (default variant). Applied by vrnetlab after its bootstrap.
! Do not configure the management interface, the admin user, or SSH here.
hostname asa-spoke2
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.3 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.3.0.1 255.255.255.0
 no shutdown
!
object network NET-SPOKE2
 subnet 10.3.0.0 255.255.255.0
object network NET-REMOTE
 subnet 10.0.0.0 255.0.0.0
nat (inside,outside) source static NET-SPOKE2 NET-SPOKE2 destination static NET-REMOTE NET-REMOTE no-proxy-arp route-lookup
!
class-map inspection_default
 match default-inspection-traffic
policy-map global_policy
 class inspection_default
  inspect icmp
service-policy global_policy global
!
crypto ikev2 policy 10
 encryption aes-gcm-256
 integrity null
 group 19
 prf sha384
 lifetime seconds 86400
crypto ikev2 enable outside
crypto ipsec ikev2 ipsec-proposal GCM
 protocol esp encryption aes-gcm-256
 protocol esp integrity null
crypto ipsec profile VTI-PROFILE
 set ikev2 ipsec-proposal GCM
!
tunnel-group 203.0.113.1 type ipsec-l2l
tunnel-group 203.0.113.1 ipsec-attributes
 ikev2 remote-authentication pre-shared-key LAB-PSK-SPOKE2
 ikev2 local-authentication pre-shared-key LAB-PSK-SPOKE2
!
interface Tunnel1
 nameif vti-hub
 ip address 169.254.2.2 255.255.255.252
 tunnel source interface outside
 tunnel destination 203.0.113.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile VTI-PROFILE
 no shutdown
!
route vti-hub 10.0.0.0 255.0.0.0 169.254.2.1 1
