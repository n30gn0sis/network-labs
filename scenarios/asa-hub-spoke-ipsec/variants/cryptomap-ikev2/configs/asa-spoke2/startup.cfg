! asa-spoke2: policy-based crypto map over IKEv2. Applied by vrnetlab after its bootstrap.
! Do not configure the management interface, the admin user, or SSH here (aaa authorization exec is needed so SSH lands in privileged mode).
hostname asa-spoke2
aaa authorization exec LOCAL auto-enable
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.3 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.3.0.1 255.255.255.0
 no shutdown
!
object network NET-SPOKE2
 subnet 10.3.0.0 255.255.255.0
object network NET-HUB
 subnet 10.1.0.0 255.255.255.0
object network NET-SPOKE1
 subnet 10.2.0.0 255.255.255.0
nat (inside,outside) source static NET-SPOKE2 NET-SPOKE2 destination static NET-HUB NET-HUB no-proxy-arp route-lookup
nat (inside,outside) source static NET-SPOKE2 NET-SPOKE2 destination static NET-SPOKE1 NET-SPOKE1 no-proxy-arp route-lookup
!
class-map inspection_default
 match default-inspection-traffic
policy-map global_policy
 class inspection_default
  inspect icmp
service-policy global_policy global
!
access-list L2L-HUB extended permit ip 10.3.0.0 255.255.255.0 10.1.0.0 255.255.255.0
access-list L2L-HUB extended permit ip 10.3.0.0 255.255.255.0 10.2.0.0 255.255.255.0
!
crypto ikev2 policy 10
 encryption aes-gcm-256
 integrity null
 group 19
 prf sha384
 lifetime seconds 86400
crypto ikev2 enable outside
crypto ipsec ikev2 ipsec-proposal GCM
 protocol esp encryption aes-gcm-256
 protocol esp integrity null
!
crypto map OUTSIDE_MAP 10 match address L2L-HUB
crypto map OUTSIDE_MAP 10 set peer 203.0.113.1
crypto map OUTSIDE_MAP 10 set ikev2 ipsec-proposal GCM
crypto map OUTSIDE_MAP interface outside
!
tunnel-group 203.0.113.1 type ipsec-l2l
tunnel-group 203.0.113.1 ipsec-attributes
 ikev2 remote-authentication pre-shared-key LAB-PSK-SPOKE2
 ikev2 local-authentication pre-shared-key LAB-PSK-SPOKE2
!
route outside 10.0.0.0 255.0.0.0 203.0.113.1 1
