! r4: AS 65002 border (eBGP to AS 65001)
frr defaults traditional
hostname r4
log syslog informational
!
interface lo
 ip address 10.2.0.4/32
 ip ospf area 0
!
interface eth1
 description r4-r3 eBGP
 ip address 192.0.2.2/30
!
interface eth2
 description r4-r6 primary
 ip address 10.2.46.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
 description r4-r5
 ip address 10.2.45.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
ip route 10.2.0.0/16 Null0
!
router ospf
 ospf router-id 10.2.0.4
 default-information originate always
!
router bgp 65002
 bgp router-id 10.2.0.4
 no bgp ebgp-requires-policy
 neighbor 192.0.2.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.2.0.0/16
  neighbor 192.0.2.1 activate
 exit-address-family
!
line vty
!
