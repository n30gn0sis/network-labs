! leaf2: AS 65002 leaf and VTEP (10.0.0.12). Unnumbered eBGP to both spines, EVPN for VNI 10.
! Explicit route-targets: FRR auto-derives RT as <ASN>:<VNI>, which would differ per leaf here.
frr defaults traditional
hostname leaf2
log syslog informational
!
interface lo
 ip address 10.0.0.12/32
!
interface eth1
 description leaf2-spine1
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 10
!
interface eth2
 description leaf2-spine2
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 10
!
router bgp 65002
 bgp router-id 10.0.0.12
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor eth1 interface peer-group fabric
 neighbor eth2 interface peer-group fabric
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor fabric activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor fabric activate
  advertise-all-vni
  vni 10
   rd auto
   route-target import 65000:10
   route-target export 65000:10
  exit-vni
 exit-address-family
!
line vty
!
