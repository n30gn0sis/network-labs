name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tool versions
        run: |
          yq --version
          shellcheck --version
      - name: Run scaffolding tests
        run: scripts/test.sh
